<div class="min-h-screen flex items-center justify-center bg-gray-50 px-6 py-12">
  <div class="w-full max-w-lg text-center">
    <!-- Error Icon -->
    <div class="mx-auto mb-8 flex h-32 w-32 items-center justify-center rounded-full bg-red-100">
      <svg class="h-16 w-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M12 9v4m0 4h.01M10.3 3.86L1.82 18a2 2 0 001.7 3h16.96a2 2 0 001.7-3L13.7 3.86a2 2 0 00-3.4 0z"
        />
      </svg>
    </div>

    <!-- Error Code -->
    <p class="mb-3 text-sm font-bold uppercase tracking-widest text-red-500">Error 500</p>

    <!-- Title -->
    <h1 class="mb-4 text-3xl font-extrabold text-gray-900 sm:text-4xl">Internal Server Error</h1>

    <!-- Description -->
    <p class="mx-auto mb-8 max-w-md text-base leading-7 text-gray-500">
      Oops! Something went wrong on our server. We're working to fix the issue. Please try again
      later.
    </p>

    <!-- Actions -->
    <div class="flex flex-col justify-center gap-3 sm:flex-row">
      <button
        type="button"
        (click)="retry()"
        class="rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200"
      >
        Try Again
      </button>

      <a
        routerLink="/"
        class="rounded-lg border border-gray-300 bg-white px-6 py-3 font-semibold text-gray-700 transition hover:bg-gray-100"
      >
        Back to Home
      </a>
    </div>

    <!-- Footer -->
    <p class="mt-10 text-sm text-gray-400">We apologize for the inconvenience.</p>
  </div>
</div>
